<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập tổng hợp</title>
</head>
<body>
<script>
    let loginAttempts = 0;
    let isLogIn = false;

    while (loginAttempts < 3) {
        let password = prompt("Vui lòng nhập mật khẩu quản trị:");
        
        if (password === "admin123") {
            console.log("Đăng nhập thành công");
            isLogIn = true;
            break;
        } else {
            loginAttempts++;
            alert(`Mật khẩu sai! Bạn còn ${3 - loginAttempts} lần thử.`);
        }
    }

    if (!isLogIn) {
        console.log("Hệ thống bị khóa");
        alert("Hệ thống bị khóa do nhập sai quá 3 lần!");
    } else {
        while (true) {
            let choice = prompt(
                "Menu quản lí thư viện\n" +
                "1. Nhập lô sách mới\n" +
                "2. Vẽ sơ đồ kệ sách\n" +
                "3. Thoát\n" +
                "Vui lòng chọn chức năng (1-3):"
            );

            if (choice === "1") {
                let bookCount = +prompt("Bạn muốn nhập bao nhiêu cuốn sách?");
                let totalValue = 0;

                for (let i = 1; i <= bookCount; i++) {
                    let price = +prompt(`Nhập giá tiền cuốn sách thứ ${i}:`);

                    if (price <= 0 || isNaN(price)) {
                        console.log(`Lỗi: Giá trị nhập cho cuốn sách thứ ${i} không hợp lệ.`);
                        continue;
                    }

                    totalValue += price;
                }
                console.log(`Tổng giá trị nhập kho đợt này là: ${totalValue} VNĐ`);

            } else if (choice === "2") {
                console.log("Sơ đồ của kệ sách");
                for (let zone = 1; zone <= 3; zone++) {
                    for (let shelf = 1; shelf <= 5; shelf++) {
                        if (zone === 2 && shelf === 3) {
                            console.log(`Khu vực ${zone} - Kệ ${shelf} (Đang sửa chữa)`);
                            continue;
                        }
                        console.log(`Khu vực ${zone} - Kệ ${shelf}`);
                    }
                }
                console.log("---------------------");

            } else if (choice === "3") {
                console.log("Hẹn gặp lại!");
                break;
            } else {
                alert("Lựa chọn không hợp lệ, vui lòng chọn lại!");
            }
        }
    }
</script>
</body>
</html>
