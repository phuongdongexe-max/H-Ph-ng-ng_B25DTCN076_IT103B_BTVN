<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 2: Vòng lặp</title>
</head>
<body>
    <script>
        let prices = [100, 200, 300, 400];

        for (let price of prices) {
            console.log(price);
        }

        for (let index in prices) {
            console.log(index);
        }

        let totalEvenIndex = 0;
        for (let i = 0; i < prices.length; i++) {
            if (i % 2 === 0) {
                totalEvenIndex += prices[i];
            }
        }
        console.log("Tổng các phần tử ở vị trí index chẵn là:", totalEvenIndex);
    </script>
</body>
</html>
