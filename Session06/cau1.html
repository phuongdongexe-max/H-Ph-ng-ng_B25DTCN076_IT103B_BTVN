<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 1: Xử lý mảng Students</title>
</head>
<body>
    <script>
        let str = "Quý, Nam, Lan, Hùng, Nam";
        let students = str.split(", ");
        
        students.reverse();

        if (students.includes("Lan")) {
            console.log("Tên Lan tồn tại trong mảng");
        } else {
            console.log("Tên Lan không tồn tại trong mảng");
        }

        let indexNam = students.indexOf("Nam");
        console.log(`Vị trí đầu tiên của tên 'Nam' trong mảng đã đảo ngược là: ${indexNam}`);
    </script>
</body>
</html>
