<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 2</title>
</head>
<body>
    <script>
        // Nhập dữ liệu từ người dùng
        let totalBook = prompt("Nhập số lượng sách trong thư viện: ");

        // Xét điều kiện và xuất dữ liệu
       if (totalBook < 10){
        console.log("Thư viện có ít sách!");
       } else if (totalBook >=10 && totalBook < 20){
        console.log("Thư viện có lượng sách vừa đủ!");
       } else {
        console.log("Thư viện có nhiều sách!!!");
       }
    </script>
</body>
</html>
