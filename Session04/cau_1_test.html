<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câu 1</title>
</head>
<script>
        let number = +prompt("Nhập số nguyên bất kì: ");
        if (number % 2 == 0){
            console.log("Đây là số chẵn");
        } else {
            console.log("Đây là số lẻ");
        }

        if (number > 0){
            console.log("Đây là số dương");
        } else if (number < 0){
            console.log("Đây là số âm");
        }

        if (number <= 0){
            console.log("Giá trị không phù hợp để tạo dãy số");
        } else {
            for (i = 0; i < number; i++){
                console.log(i + 1);
            }
        }
</script>
<body>
    
</body>
</html>
