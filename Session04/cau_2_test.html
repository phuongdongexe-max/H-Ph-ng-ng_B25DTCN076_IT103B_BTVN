<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câu 2</title>
</head>
<script>
        let count = 0;
        let checkNumber = 50;
        for (let i = 1; i <= checkNumber; i++){
            if (i % 3 == 0 && i % 5 == 0){
                console.log("FizzBuzz");
            } else if (i % 3 == 0){
                console.log("Fizz");
                count++;
            } else if (i % 5 == 0){
                console.log("Buzz");
            } else {
                console.log(i);
            }
        }
        console.log("Số lần chữ "Fizz" xuất hiện": count);
</script>
<body>
    <h1>f12 để check kết quả.</h1>
</body>
</html>
