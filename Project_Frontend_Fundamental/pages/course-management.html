<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Tracker - Quản lý môn học</title>
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/course-management.css">
</head>
<body>
  <div class="dashboard">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <strong>Study Tracker</strong>
        <span>Quản lý tiến độ học tập</span>
      </div>
      <nav>
        <a href="#" class="nav-item active" data-tab="courses">📚 Quản lý môn học</a>
        <a href="#" class="nav-item" data-tab="lessons">📖 Quản lý bài học</a>
      </nav>
      <div style="margin-top: auto; padding: 20px 24px;">
        <a href="login.html" style="color: #dc3545; text-decoration: none; font-size: 14px;">Đăng xuất</a>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main-content">
      <header class="topbar">
        <input type="text" id="searchInput" placeholder="Tìm kiếm môn học hoặc bài học...">
        <div class="topbar-right">
          <button class="icon-btn">🛎️</button>
          <button class="icon-btn">❔</button>
          <div class="user">
            <img src="https://i.pravatar.cc/36?u=dong" alt="User" class="avatar">
            <span>Hồ Phương Đông</span>
          </div>
        </div>
      </header>

      <!-- Tab Môn học -->
      <div id="tab-courses" class="tab-content active">
        <div class="page-header">
          <h1>Môn học</h1>
          <div class="actions">
            <select id="statusFilter">
              <option value="">Lọc theo trạng thái</option>
              <option value="active">Đang hoạt động</option>
              <option value="inactive">Ngừng hoạt động</option>
            </select>
            <button id="btnAddCourse" class="btn btn-primary">+ Thêm mới môn học</button>
          </div>
        </div>
        <table class="data-table" id="courseTable">
          <thead>
            <tr>
              <th>Tên môn học</th>
              <th>Trạng thái</th>
              <th>Chức năng</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- Tab Bài học -->
      <div id="tab-lessons" class="tab-content">
        <div class="page-header">
          <h1>Bài học</h1>
          <div class="actions">
            <select id="courseFilter">
              <option value="">Lọc theo môn học</option>
            </select>
            <button id="btnAddLesson" class="btn btn-primary">+ Thêm mới bài học</button>
          </div>
        </div>
        <table class="data-table" id="lessonTable">
          <thead>
            <tr>
              <th><input type="checkbox" id="selectAll"></th>
              <th>Tên bài học</th>
              <th>Thời gian học (phút)</th>
              <th>Trạng thái</th>
              <th>Chức năng</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Modal Xác nhận xóa -->
  <div id="deleteModal" class="modal">
    <div class="modal-content">
      <div class="warning-icon">⚠️</div>
      <h3>Xác nhận</h3>
      <p id="deleteMessage"></p>
      <div class="modal-footer">
        <button id="btnCancelDelete" class="btn btn-secondary">Hủy</button>
        <button id="btnConfirmDelete" class="btn btn-danger">Xóa</button>
      </div>
    </div>
  </div>

  <!-- Modal Thêm / Sửa Môn học -->
  <div id="courseModal" class="modal">
    <div class="modal-content" style="max-width: 480px;">
      <h3 id="courseModalTitle">Thêm mới môn học</h3>
      <form id="courseForm">
        <input type="hidden" id="courseId">
        <div class="input-group">
          <label>Tên môn học</label>
          <input type="text" id="courseName" required>
        </div>
        <div class="input-group">
          <label>Trạng thái</label>
          <select id="courseStatus">
            <option value="active">Đang hoạt động</option>
            <option value="inactive">Ngừng hoạt động</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="button" id="btnCancelCourse" class="btn btn-secondary">Hủy</button>
          <button type="submit" class="btn btn-primary">Lưu</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Thêm / Sửa Bài học -->
  <div id="lessonModal" class="modal">
    <div class="modal-content" style="max-width: 520px;">
      <h3 id="lessonModalTitle">Thêm mới bài học</h3>
      <form id="lessonForm">
        <input type="hidden" id="lessonId">
        <div class="input-group">
          <label>Tên bài học</label>
          <input type="text" id="lessonName" required>
        </div>
        <div class="input-group">
          <label>Thuộc môn học</label>
          <select id="lessonCourse"></select>
        </div>
        <div class="input-group">
          <label>Thời gian học (phút)</label>
          <input type="number" id="lessonDuration" value="45" required>
        </div>
        <div class="modal-footer">
          <button type="button" id="btnCancelLesson" class="btn btn-secondary">Hủy</button>
          <button type="submit" class="btn btn-primary">Lưu</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/course-management.js"></script>
</body>
</html>
