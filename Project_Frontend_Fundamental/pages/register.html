<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký - Study Tracker</title>
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/register.css">
</head>
<body>
  <div class="register-container">
    <div class="form-wrapper">
      <h1>Đăng ký tài khoản</h1>
      <p class="subtitle">Đăng ký tài khoản để sử dụng dịch vụ</p>

      <form id="registerForm">
        <div class="name-row">
          <div class="input-group">
            <label>Họ và tên đệm</label>
            <input type="text" id="ho" placeholder="Nguyễn Văn" required>
          </div>
          <div class="input-group">
            <label>Tên</label>
            <input type="text" id="ten" placeholder="A" required>
          </div>
        </div>

        <div class="input-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="you@email.com" required>
        </div>

        <div class="input-group">
          <label>Mật khẩu</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <label class="checkbox-label">
          <input type="checkbox" id="agree" required>
          Bạn đồng ý với <a href="#" class="link">chính sách và điều khoản</a>
        </label>

        <button type="submit" class="btn btn-primary">Đăng ký</button>
      </form>

      <p class="link-text">
        Bạn đã có tài khoản? 
        <a href="login.html">Đăng nhập</a>
      </p>
    </div>
  </div>

  <script src="../js/register.js"></script>
</body>
</html>
