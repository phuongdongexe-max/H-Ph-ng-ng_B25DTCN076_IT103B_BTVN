<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập | Hệ thống quản lý học tập</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>

  <div class="login-container">
    <h1 class="login-title">Đăng nhập</h1>
    <p class="login-subtitle">Đăng nhập tài khoản để sử dụng hệ thống quản lý.</p>

    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input class="form-input" type="email" id="email" name="email" autocomplete="email" />
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Mật khẩu</label>
      <input class="form-input" type="password" id="password" name="password" autocomplete="current-password" />
    </div>

    <div class="form-options">
      <label class="checkbox-label">
        <input type="checkbox" id="remember" name="remember" />
        <span>Nhớ tài khoản</span>
      </label>
      <a href="#" class="link-forgot">Quên mật khẩu?</a>
    </div>

    <button class="btn-login" type="button">Đăng nhập</button>

    <p class="register-row">
      Bạn chưa có tài khoản?<a href="./register.html">Đăng ký</a>
    </p>
  </div>

</body>
</html>
