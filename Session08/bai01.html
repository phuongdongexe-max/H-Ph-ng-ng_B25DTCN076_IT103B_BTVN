<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 01</title>
</head>

<body>
    <script>
        // 1. Khai báo mảng players theo đề bài
        const players = [
            "Messi - Forward",
            "Ronaldo - Forward",
            "Neymar - Forward",
            "De Bruyne - Midfielder",
            "Kante - Midfielder",
            "Van Dijk - Defender",
            "Alisson - Goalkeeper",
        ];

        // 2. Viết hàm displayPlayers
        function displayPlayers(list) {
            // Sử dụng phương thức forEach để duyệt qua từng phần tử
            list.forEach(function (player) {
                console.log(player);
            });
        }

        // 3. Gọi hàm để kiểm tra kết quả
        displayPlayers(players);
    </script>
</body>

</html>
