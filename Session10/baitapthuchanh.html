<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập thực hành</title>
</head>

<body>
    <script>
        let squad = [
            { id: 1, name: "Nguyen Van A", goals: 10, position: "FW" },
            { id: 2, name: "Tran Van B", goals: 5, position: "MF" },
            { id: 3, name: "Le Van C", goals: 0, position: "DF" },
            { id: 4, name: "Pham Van D", goals: 12, position: "FW" },
            { id: 5, name: "Dang Van E", goals: 0, position: "GK" }
        ];

        function quanLyDoiBong() {
            while (true) {
                let menu = "=== QUẢN LÝ ĐỘI BÓNG (OBJECT) ===\n" +
                    "1. Xem danh sách\n" +
                    "2. Thêm cầu thủ\n" +
                    "3. Tìm kiếm (theo ID)\n" +
                    "4. Cập nhật bàn thắng\n" +
                    "5. Xóa cầu thủ\n" +
                    "0. Thoát";

                let choice = prompt(menu);

                if (choice === "0" || choice === null) {
                    alert("Đã thoát chương trình!");
                    break;
                }

                switch (choice) {
                    case "1":
                        let danhSach = "=> DANH SÁCH:\n";
                        squad.forEach(player => {
                            danhSach += `Mã ${player.id} - ${player.name} (${player.position}): ${player.goals} bàn\n`;
                        });
                        alert(danhSach);
                        break;

                    case "2":
                        let newName = prompt("Nhập tên cầu thủ:");
                        let newGoals = parseInt(prompt("Nhập số bàn thắng:") || "0", 10);
                        let newPosition = prompt("Nhập vị trí (FW, MF, DF, GK):");

                        let newId = squad.length > 0 ? squad[squad.length - 1].id + 1 : 1;

                        let newPlayer = {
                            id: newId,
                            name: newName,
                            goals: newGoals,
                            position: newPosition
                        };

                        squad.push(newPlayer);
                        alert(`Đã thêm thành công cầu thủ: ${newName} (Mã: ${newId})`);
                        break;

                    case "3":
                        let searchId = parseInt(prompt("Nhập ID cầu thủ cần tìm:"), 10);
                        let foundPlayer = squad.find(player => player.id === searchId);

                        if (foundPlayer) {
                            alert(`THÔNG TIN CẦU THỦ:\nMã ${foundPlayer.id} - ${foundPlayer.name} (${foundPlayer.position}): ${foundPlayer.goals} bàn`);
                        } else {
                            alert("Không tìm thấy cầu thủ với ID này!");
                        }
                        break;

                    case "4":
                        let updateId = parseInt(prompt("Nhập ID cầu thủ vừa ghi bàn:"), 10);
                        let playerToUpdate = squad.find(player => player.id === updateId);

                        if (playerToUpdate) {
                            playerToUpdate.goals += 1;
                            alert(`=> Đã cập nhật: ${playerToUpdate.name} hiện có ${playerToUpdate.goals} bàn thắng.`);
                        } else {
                            alert("Không tìm thấy cầu thủ để cập nhật!");
                        }
                        break;

                    case "5":
                        let deleteId = parseInt(prompt("Nhập ID cầu thủ cần xóa/chuyển nhượng:"), 10);
                        let indexToDelete = squad.findIndex(player => player.id === deleteId);

                        if (indexToDelete !== -1) {
                            let removedName = squad[indexToDelete].name;
                            squad.splice(indexToDelete, 1);
                            alert(`Đã xóa thành công cầu thủ: ${removedName}`);
                        } else {
                            alert("Không tìm thấy cầu thủ để xóa!");
                        }
                        break;

                    default:
                        alert("Lựa chọn không hợp lệ. Vui lòng nhập số từ 0 đến 5!");
                }
            }
        }

        quanLyDoiBong();
    </script>
</body>

</html>
