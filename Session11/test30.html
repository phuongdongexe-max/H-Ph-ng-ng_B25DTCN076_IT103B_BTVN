<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài kiểm tra 30 phút đầu giờ</title>
</head>

<body>
    <script>

        let choice;

        do {

            let products = [
                { id: 'P01', name: 'Laptop Macbook Pro M3', price: 2000, category: 'Laptop', inStock: true },
                { id: 'P02', name: 'Chuột không dây LogiTech', price: 45, category: 'Phụ kiện', inStock: true },
                { id: 'P03', name: 'Bàn phím cơ Keychron', price: 95, category: 'Phụ kiện', inStock: false },
                { id: 'P04', name: 'Màn hình Dell UltraSharp', price: 450, category: 'Màn hình', inStock: true },
                { id: 'P05', name: 'Tai nghe Sony WH-1000XM5', price: 350, category: 'Phụ kiện', inStock: true },
            ]
            choice = +prompt('1. Tìm kiếm theo ID.\n' +
                '2. Kiểm tra.\n' +
                '3. Chuẩn hóa dữ liệu.\n'
            );
            switch (choice) {
                case 1:
                    let found = prompt('Mời bạn nhập ID sản phẩm cần tìm;').toLowerCase;
                    let foundSuccess = products.filter(have => (products.id) == found)
                    alert(`Sản phẩm ${products.id} có tên ${products.name} giá: ${products.price}.`);
                    break;
                case 2:
                    let check = products.every(check => products.price > 0)
                    if (check){
                        alert('Dữ liệu không bị lỗi');
                    } else {
                        alert('Dữ liệu lỗi.')
                    }
                    break;
                case 3:
                    break;
                case 0:
                    alert('Đã thoát chương trình!!!')
                    break;

            }
        } while (choice != 0);

    </script>
</body>

</html>
