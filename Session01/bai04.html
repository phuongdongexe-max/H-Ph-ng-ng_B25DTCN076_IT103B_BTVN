<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 4</title>
</head>
<body>
    <script>
        let bookTitle = prompt("Nhập tiêu đề sách:");
        let upperCaseTitle = bookTitle.toUpperCase();
        let lowerCaseTitle = bookTitle.toLowerCase();

        console.log("Tiêu đề đã nhập" + bookTitle);
        console.log("Không viết hoa: " + lowerCaseTitle);
        console.log("Viết hoa toàn bộ: " + upperCaseTitle);
    </script>
</body>
</html>
