<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 3</title>
</head>
<body>

    <script>

        let inputBefore = prompt("Nhập số sách cũ:");
        
        let inputCurrent = prompt("Nhập số sách mới nhập:");

        let oldData = Number(inputBefore);
        
        let newData = Number(inputCurrent);

        let total = oldData + newData;

        console.log("Tổng số sách hiện tại là: " + total);
        
    </script>

</body>
</html>
