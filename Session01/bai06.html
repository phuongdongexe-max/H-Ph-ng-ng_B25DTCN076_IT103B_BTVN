<body>
    <script>
        let bookTitle = prompt("Nhập tên sách:");
        let bookOrder = prompt("Nhập số thứ tự sách:");
        let normalizedTitle = bookTitle.trim().toUpperCase();
        let bookCode = "LIB - " + normalizedTitle + " - " + bookOrder;

        console.log("Tên sách gốc: " + bookTitle);
        console.log("Mã sách sau chuẩn hóa: " + bookCode);
    </script>

</body>
