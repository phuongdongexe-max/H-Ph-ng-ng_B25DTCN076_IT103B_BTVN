<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Sản Phẩm Chợ Tết</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        #product-list { list-style-type: none; padding: 0; max-width: 450px; }
        
        /* Chỉnh lại CSS một chút để nút Xóa nằm ngang hàng với tên sản phẩm */
        .product-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border: 1px solid #ccc; 
            padding: 10px; 
            margin-bottom: 10px; 
            background-color: #f9f9f9; 
            border-radius: 4px;
        }
        
        form { margin-top: 20px; }
        input { margin-right: 5px; padding: 5px; }
        button { padding: 5px 10px; cursor: pointer; }
        
        /* CSS cho nút Xóa */
        .delete-btn { 
            background-color: #ff4d4d; 
            color: white; 
            border: none; 
            border-radius: 3px; 
            padding: 5px 10px;
        }
        .delete-btn:hover { background-color: #cc0000; }
    </style>
</head>
<body>

    <h1>Danh Sách Sản Phẩm Chợ Tết</h1>
    <ul id="product-list">
        </ul>

    <form id="product-form">
        <input type="text" id="product-name" placeholder="Tên sản phẩm" required>
        <input type="number" id="product-price" placeholder="Giá (VND)" required>
        <button type="submit">Thêm Sản Phẩm</button>
    </form>

    <script>
        const products = [
            { id: 1, name: "Bánh Chưng", price: 150000 },
            { id: 2, name: "Giò Lụa", price: 180000 },
            { id: 3, name: "Cành Đào", price: 500000 },
            { id: 4, name: "Mứt Tết", price: 120000 },
            { id: 5, name: "Bao Lì Xì", price: 25000 },
            { id: 6, name: "Dưa Hấu Tết", price: 80000 },
        ];

        const productList = document.getElementById("product-list");
        const productForm = document.getElementById("product-form");
        const nameInput = document.getElementById("product-name");
        const priceInput = document.getElementById("product-price");

        // --- CẬP NHẬT: Hàm tạo phần tử giờ có thêm nút Xóa ---
        function createProductItem(product) {
            const liItem = document.createElement("li");
            liItem.className = "product-item";

            // 1. Tạo phần chứa thông tin sản phẩm
            const divProduct = document.createElement("div");
            divProduct.className = "product";
            const priceFormatted = product.price.toLocaleString("vi-VN");
            divProduct.innerHTML = `<strong>${product.name}</strong> - ${priceFormatted} VND`;

            // 2. Tạo nút Xóa
            const deleteBtn = document.createElement("button");
            deleteBtn.className = "delete-btn";
            deleteBtn.textContent = "Xóa";

            // 3. Xử lý sự kiện click cho nút Xóa
            deleteBtn.addEventListener("click", function() {
                // Hiển thị hộp thoại xác nhận
                const isConfirm = confirm("Bạn có chắc muốn xóa sản phẩm này?");
                
                // Nếu người dùng chọn OK (đồng ý)
                if (isConfirm) {
                    liItem.remove(); // Xóa thẻ <li> khỏi DOM
                }
            });

            // 4. Gắn thẻ div và nút Xóa vào trong thẻ li
            liItem.appendChild(divProduct);
            liItem.appendChild(deleteBtn);

            return liItem;
        }

        // Khởi tạo danh sách ban đầu
        products.forEach(product => {
            const newItem = createProductItem(product);
            productList.appendChild(newItem);
        });

        // Xử lý Thêm sản phẩm
        productForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const newName = nameInput.value;
            const newPrice = Number(priceInput.value);

            const newProduct = {
                id: products.length > 0 ? products[products.length - 1].id + 1 : 1, 
                name: newName,
                price: newPrice
            };

            products.push(newProduct);
            
            // Vì hàm createProductItem đã có sẵn logic gắn sự kiện nút Xóa,
            // nên sản phẩm mới thêm vào cũng sẽ có thể xóa được ngay.
            const newDOMItem = createProductItem(newProduct);
            productList.appendChild(newDOMItem);

            nameInput.value = "";
            priceInput.value = "";
        });
    </script>
</body>
</html>
