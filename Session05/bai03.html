<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 03</title>
</head>
<body>
    <script>
        let booksId = [];
        let booksName = [];
        let inventoryQuantity = [];

        let inputCount = prompt("Có bao nhiêu loại sách cần kiểm tra bổ sung hôm nay?");
        let n = Number(inputCount);

        for (let i = 0; i < n; i++) {
            let id = prompt(`Sách thứ ${i + 1}: Nhập Mã sách (VD: JS001):`);
            let name = prompt(`Sách thứ ${i + 1}: Nhập Tên sách:`);
            let qtyInput = prompt(`Sách thứ ${i + 1}: Nhập Số lượng tồn kho:`);
            let qty = Number(qtyInput);

            booksId.push(id);
            booksName.push(name);
            inventoryQuantity.push(qty);
        }

        console.clear();
        
        console.log(`Danh sách sách cần xem xét bổ sung (${booksId.length} loại):`);

        let priorityCount = 0;
        let outOfStockIds = [];

        for (let i = 0; i < booksId.length; i++) {
            console.log(`${i + 1}. Mã: ${booksId[i]} - Tên: ${booksName[i]} - Còn: ${inventoryQuantity[i]} bản`);

            if (inventoryQuantity[i] <= 5) {
                priorityCount++;
            }

            if (inventoryQuantity[i] === 0) {
                outOfStockIds.push(booksId[i]);
            }
        }

        console.log("");
        console.log(`Số sách có tồn kho ≤ 5 bản: ${priorityCount} loại`);
        console.log(`Các mã sách đã hết hàng (0 bản): ${outOfStockIds.join(", ")}`);
    </script>
</body>
</html>
